<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Pro - Advanced Study Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      /* Auth buttons for signed out state */
      .auth-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .auth-btn {
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .login-btn {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .login-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .signup-btn {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: #fff;
        border: none;
      }

      .signup-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      /* Hide elements based on auth state */
      .user-dropdown.hidden {
        display: none;
      }

      .auth-buttons.hidden {
        display: none;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0f0f0f;
        color: #fff;
        overflow-x: hidden;
      }

      /* Header Styles */
      .header {
        background: rgba(17, 17, 17, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 15px 30px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(45deg, #00f2fe, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo i {
        font-size: 28px;
        color: #4facfe;
      }

      /* User Dropdown */
      .user-dropdown {
        position: relative;
      }

      .user-button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 30px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
      }

      .user-button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(45deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }

      .dropdown-menu {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 10px;
        background: rgba(17, 17, 17, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        min-width: 200px;
        padding: 8px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
      }

      .dropdown-menu.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .dropdown-item {
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.8);
      }

      .dropdown-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }

      .dropdown-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin: 8px 0;
      }

      /* Main Content */
      .main-content {
        margin-top: 80px;
        padding: 20px;
        max-width: 1600px;
        margin-left: auto;
        margin-right: auto;
      }

      /* Dashboard Grid */
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      /* Widget Styles */
      .widget {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .widget::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.02)
        );
        transform: translateX(-100%);
        transition: transform 0.6s ease;
      }

      .widget:hover::before {
        transform: translateX(100%);
      }

      .widget:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .widget-header {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .widget-title {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .widget-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      /* Timer Widget */
      .timer-widget .widget-icon {
        background: linear-gradient(45deg, #f093fb, #f5576c);
      }

      .timer-display {
        font-size: 72px;
        font-weight: 300;
        text-align: center;
        margin: 30px 0;
        font-feature-settings: "tnum";
        background: linear-gradient(45deg, #00f2fe, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
      }

      .timer-controls {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .timer-controls button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        font-size: 14px;
      }

      .timer-controls button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .timer-presets {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }

      .preset-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.8);
        padding: 6px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.3s ease;
      }

      .preset-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      /* Stats Widget */
      .stats-widget .widget-icon {
        background: linear-gradient(45deg, #4facfe, #00f2fe);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .stat-item {
        text-align: center;
        padding: 20px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .stat-value {
        font-size: 36px;
        font-weight: 700;
        background: linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stat-label {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 5px;
      }

      /* Progress Widget */
      .progress-widget .widget-icon {
        background: linear-gradient(45deg, #667eea, #764ba2);
      }

      .progress-bars {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .progress-item {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .progress-label {
        flex: 0 0 100px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .progress-bar {
        flex: 1;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        border-radius: 4px;
        transition: width 0.8s ease;
        position: relative;
        overflow: hidden;
      }

      .progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-200%);
        }
        100% {
          transform: translateX(200%);
        }
      }

      .progress-percentage {
        flex: 0 0 50px;
        text-align: right;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
      }

      /* Todo Widget */
      .todo-widget .widget-icon {
        background: linear-gradient(45deg, #fa709a, #fee140);
      }

      .todo-input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .todo-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 16px;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .todo-input:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }

      .todo-add-btn {
        background: linear-gradient(45deg, #667eea, #764ba2);
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        color: #fff;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .todo-add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .todo-list {
        max-height: 300px;
        overflow-y: auto;
        padding-right: 10px;
      }

      .todo-list::-webkit-scrollbar {
        width: 6px;
      }

      .todo-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }

      .todo-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .todo-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px;
        border-radius: 12px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.3s ease;
      }

      .todo-item:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateX(5px);
      }

      .todo-checkbox {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
      }

      .todo-checkbox.checked {
        background: linear-gradient(45deg, #667eea, #764ba2);
        border-color: transparent;
      }

      .todo-checkbox.checked::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 14px;
      }

      .todo-text {
        flex: 1;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.9);
        transition: all 0.3s ease;
      }

      .todo-text.completed {
        text-decoration: line-through;
        color: rgba(255, 255, 255, 0.4);
      }

      .todo-delete {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        font-size: 18px;
        transition: all 0.3s ease;
      }

      .todo-delete:hover {
        color: #f5576c;
        transform: scale(1.1);
      }

      /* Notes Widget */
      .notes-widget {
        grid-column: span 2;
      }

      .notes-widget .widget-icon {
        background: linear-gradient(45deg, #ffecd2, #fcb69f);
      }

      .notes-textarea {
        width: 100%;
        min-height: 250px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 16px;
        color: #fff;
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
        transition: all 0.3s ease;
      }

      .notes-textarea:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
      }

      .notes-controls {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      .notes-controls button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .notes-controls button:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-2px);
      }

      /* Calendar Widget */
      .calendar-widget .widget-icon {
        background: linear-gradient(45deg, #f093fb, #f5576c);
      }

      .mini-calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin-top: 20px;
      }

      .calendar-day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .calendar-day:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }

      .calendar-day.today {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: #fff;
        font-weight: 600;
      }

      .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .calendar-month {
        font-size: 16px;
        font-weight: 600;
      }

      .calendar-nav {
        display: flex;
        gap: 10px;
      }

      .calendar-nav button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .calendar-nav button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* Weather Widget */
      .weather-widget .widget-icon {
        background: linear-gradient(45deg, #00f2fe, #4facfe);
      }

      .weather-info {
        text-align: center;
        margin: 20px 0;
      }

      .weather-temp {
        font-size: 48px;
        font-weight: 300;
        background: linear-gradient(45deg, #00f2fe, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .weather-desc {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 10px;
      }

      .weather-details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-top: 20px;
      }

      .weather-detail {
        text-align: center;
        padding: 10px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
      }

      .weather-detail-icon {
        font-size: 20px;
        color: #4facfe;
        margin-bottom: 5px;
      }

      .weather-detail-value {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      /* Responsive Design */
      @media (max-width: 1200px) {
        .dashboard-grid {
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .notes-widget {
          grid-column: span 1;
        }
      }

      @media (max-width: 768px) {
        .main-content {
          padding: 10px;
        }

        .timer-display {
          font-size: 48px;
        }

        .stat-value {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <i class="fas fa-graduation-cap"></i>
        Study Pro
      </div>
      <div class="auth-buttons">
        <button class="auth-btn login-btn" onclick="showLoginModal()">
          <i class="fas fa-sign-in-alt"></i>
          Login
        </button>
        <button class="auth-btn signup-btn" onclick="showSignupModal()">
          <i class="fas fa-user-plus"></i>
          Sign Up
        </button>
      </div>
    </header>

    <main class="main-content">
      <div class="dashboard-grid">
        <!-- Timer Widget -->
        <div class="widget timer-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-clock"></i>
              </div>
              Focus Timer
            </div>
          </div>
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-controls">
            <button onclick="startTimer()">
              <i class="fas fa-play"></i> Start
            </button>
            <button onclick="pauseTimer()">
              <i class="fas fa-pause"></i> Pause
            </button>
            <button onclick="resetTimer()">
              <i class="fas fa-redo"></i> Reset
            </button>
          </div>
          <div class="timer-presets">
            <button class="preset-btn" onclick="setTimer(5)">5 min</button>
            <button class="preset-btn" onclick="setTimer(10)">10 min</button>
            <button class="preset-btn" onclick="setTimer(25)">25 min</button>
            <button class="preset-btn" onclick="setTimer(50)">50 min</button>
          </div>
        </div>

        <!-- Stats Widget -->
        <div class="widget stats-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-chart-line"></i>
              </div>
              Today's Stats
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value" id="studyTime">2.5</div>
              <div class="stat-label">Hours Studied</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="tasksCompleted">7</div>
              <div class="stat-label">Tasks Completed</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="focusSessions">4</div>
              <div class="stat-label">Focus Sessions</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="streak">12</div>
              <div class="stat-label">Day Streak</div>
            </div>
          </div>
        </div>

        <!-- Progress Widget -->
        <div class="widget progress-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-tasks"></i>
              </div>
              Weekly Progress
            </div>
          </div>
          <div class="progress-bars">
            <div class="progress-item">
              <span class="progress-label">Mathematics</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 75%"></div>
              </div>
              <span class="progress-percentage">75%</span>
            </div>
            <div class="progress-item">
              <span class="progress-label">Physics</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 60%"></div>
              </div>
              <span class="progress-percentage">60%</span>
            </div>
            <div class="progress-item">
              <span class="progress-label">Chemistry</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 90%"></div>
              </div>
              <span class="progress-percentage">90%</span>
            </div>
            <div class="progress-item">
              <span class="progress-label">Biology</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 45%"></div>
              </div>
              <span class="progress-percentage">45%</span>
            </div>
          </div>
        </div>

        <!-- Todo Widget -->
        <div class="widget todo-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-list-check"></i>
              </div>
              Tasks
            </div>
          </div>
          <div class="todo-input-group">
            <input
              type="text"
              class="todo-input"
              id="todoInput"
              placeholder="Add a new task..."
            />
            <button class="todo-add-btn" onclick="addTodo()">
              <i class="fas fa-plus"></i> Add
            </button>
          </div>
          <div class="todo-list" id="todoList"></div>
        </div>

        <!-- Calendar Widget -->
        <div class="widget calendar-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-calendar-alt"></i>
              </div>
              Calendar
            </div>
          </div>
          <div class="calendar-header">
            <span class="calendar-month" id="calendarMonth">May 2025</span>
            <div class="calendar-nav">
              <button onclick="previousMonth()">
                <i class="fas fa-chevron-left"></i>
              </button>
              <button onclick="nextMonth()">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          </div>
          <div class="mini-calendar" id="miniCalendar"></div>
        </div>

        <!-- Weather Widget -->
        <div class="widget weather-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-cloud-sun"></i>
              </div>
              Weather
            </div>
          </div>
          <div class="weather-info">
            <div class="weather-temp">72°F</div>
            <div class="weather-desc">Partly Cloudy</div>
          </div>
          <div class="weather-details">
            <div class="weather-detail">
              <div class="weather-detail-icon">
                <i class="fas fa-tint"></i>
              </div>
              <div class="weather-detail-value">45%</div>
            </div>
            <div class="weather-detail">
              <div class="weather-detail-icon">
                <i class="fas fa-wind"></i>
              </div>
              <div class="weather-detail-value">8 mph</div>
            </div>
            <div class="weather-detail">
              <div class="weather-detail-icon">
                <i class="fas fa-eye"></i>
              </div>
              <div class="weather-detail-value">10 mi</div>
            </div>
          </div>
        </div>

        <!-- Notes Widget -->
        <div class="widget notes-widget">
          <div class="widget-header">
            <div class="widget-title">
              <div class="widget-icon">
                <i class="fas fa-sticky-note"></i>
              </div>
              Notes
            </div>
          </div>
          <textarea
            class="notes-textarea"
            id="notesArea"
            placeholder="Write your study notes here..."
          ></textarea>
          <div class="notes-controls">
            <button onclick="saveNotes()">
              <i class="fas fa-save"></i> Save
            </button>
            <button onclick="clearNotes()">
              <i class="fas fa-trash"></i> Clear
            </button>
            <button onclick="exportNotes()">
              <i class="fas fa-download"></i> Export
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Timer functionality
      let timerInterval;
      let seconds = 1500; // 25 minutes
      let isPaused = true;
      let totalStudyTime = 0;

      function updateTimerDisplay() {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById("timerDisplay").textContent =
          `${minutes.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
      }

      function startTimer() {
        if (isPaused) {
          isPaused = false;
          timerInterval = setInterval(() => {
            if (seconds > 0) {
              seconds--;
              totalStudyTime++;
              updateTimerDisplay();
              updateStats();
            } else {
              notifyUser("Timer finished!");
              resetTimer();
              incrementFocusSessions();
            }
          }, 1000);
        }
      }

      function pauseTimer() {
        isPaused = true;
        clearInterval(timerInterval);
      }

      function resetTimer() {
        pauseTimer();
        seconds = 1500;
        updateTimerDisplay();
      }

      function setTimer(minutes) {
        pauseTimer();
        seconds = minutes * 60;
        updateTimerDisplay();
      }

      // User dropdown
      function toggleDropdown() {
        const dropdown = document.getElementById("dropdownMenu");
        dropdown.classList.toggle("active");
      }

      // Close dropdown when clicking outside
      window.addEventListener("click", function (e) {
        const dropdown = document.getElementById("dropdownMenu");
        const userButton = document.querySelector(".user-button");
        if (!userButton.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.remove("active");
        }
      });

      // Todo functionality
      function addTodo() {
        const input = document.getElementById("todoInput");
        const text = input.value.trim();

        if (text) {
          const todoList = document.getElementById("todoList");
          const todoItem = document.createElement("div");
          todoItem.className = "todo-item";
          todoItem.innerHTML = `
                    <div class="todo-checkbox" onclick="toggleTodo(this)"></div>
                    <span class="todo-text">${text}</span>
                    <button class="todo-delete" onclick="deleteTodo(this)">
                        <i class="fas fa-times"></i>
                    </button>
                `;
          todoList.appendChild(todoItem);
          input.value = "";
          saveTodos();
          updateTaskCount();
        }
      }

      function toggleTodo(checkbox) {
        checkbox.classList.toggle("checked");
        const todoText = checkbox.nextElementSibling;
        todoText.classList.toggle("completed");
        saveTodos();
        updateTaskCount();
      }

      function deleteTodo(button) {
        button.parentElement.remove();
        saveTodos();
        updateTaskCount();
      }

      function saveTodos() {
        const todos = [];
        document.querySelectorAll(".todo-item").forEach((item) => {
          const checkbox = item.querySelector(".todo-checkbox");
          const text = item.querySelector(".todo-text").textContent;
          todos.push({
            text,
            completed: checkbox.classList.contains("checked"),
          });
        });
        localStorage.setItem("todos", JSON.stringify(todos));
      }

      function loadTodos() {
        const todos = JSON.parse(localStorage.getItem("todos") || "[]");
        const todoList = document.getElementById("todoList");

        todos.forEach((todo) => {
          const todoItem = document.createElement("div");
          todoItem.className = "todo-item";
          todoItem.innerHTML = `
                    <div class="todo-checkbox ${todo.completed ? "checked" : ""}" onclick="toggleTodo(this)"></div>
                    <span class="todo-text ${todo.completed ? "completed" : ""}">${todo.text}</span>
                    <button class="todo-delete" onclick="deleteTodo(this)">
                        <i class="fas fa-times"></i>
                    </button>
                `;
          todoList.appendChild(todoItem);
        });
      }

      // Notes functionality
      function saveNotes() {
        const notes = document.getElementById("notesArea").value;
        localStorage.setItem("studyNotes", notes);
        notifyUser("Notes saved!");
      }

      function clearNotes() {
        if (confirm("Are you sure you want to clear all notes?")) {
          document.getElementById("notesArea").value = "";
          saveNotes();
        }
      }

      function exportNotes() {
        const notes = document.getElementById("notesArea").value;
        const blob = new Blob([notes], { type: "text/plain" });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "study-notes.txt";
        a.click();
        window.URL.revokeObjectURL(url);
      }

      function loadNotes() {
        const notes = localStorage.getItem("studyNotes");
        if (notes) {
          document.getElementById("notesArea").value = notes;
        }
      }

      // Calendar functionality
      let currentMonth = new Date().getMonth();
      let currentYear = new Date().getFullYear();

      function generateCalendar() {
        const calendar = document.getElementById("miniCalendar");
        const monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        document.getElementById("calendarMonth").textContent =
          `${monthNames[currentMonth]} ${currentYear}`;

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(
          currentYear,
          currentMonth + 1,
          0,
        ).getDate();
        const today = new Date();

        calendar.innerHTML = "";

        // Day headers
        const dayHeaders = ["S", "M", "T", "W", "T", "F", "S"];
        dayHeaders.forEach((day) => {
          const dayHeader = document.createElement("div");
          dayHeader.className = "calendar-day";
          dayHeader.style.fontWeight = "600";
          dayHeader.style.color = "rgba(255, 255, 255, 0.4)";
          dayHeader.textContent = day;
          calendar.appendChild(dayHeader);
        });

        // Empty cells before first day
        for (let i = 0; i < firstDay; i++) {
          const emptyDay = document.createElement("div");
          emptyDay.className = "calendar-day";
          calendar.appendChild(emptyDay);
        }

        // Days of the month
        for (let day = 1; day <= daysInMonth; day++) {
          const dayElement = document.createElement("div");
          dayElement.className = "calendar-day";
          dayElement.textContent = day;

          if (
            today.getDate() === day &&
            today.getMonth() === currentMonth &&
            today.getFullYear() === currentYear
          ) {
            dayElement.classList.add("today");
          }

          calendar.appendChild(dayElement);
        }
      }

      function previousMonth() {
        currentMonth--;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }
        generateCalendar();
      }

      function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
        generateCalendar();
      }

      // Stats functionality
      function updateStats() {
        // Update study time
        const hours = (totalStudyTime / 3600).toFixed(1);
        document.getElementById("studyTime").textContent = hours;

        // Save stats
        localStorage.setItem("totalStudyTime", totalStudyTime);
      }

      function updateTaskCount() {
        const completedTasks = document.querySelectorAll(
          ".todo-checkbox.checked",
        ).length;
        document.getElementById("tasksCompleted").textContent = completedTasks;
        localStorage.setItem("tasksCompleted", completedTasks);
      }

      function incrementFocusSessions() {
        const sessions =
          parseInt(localStorage.getItem("focusSessions") || "0") + 1;
        document.getElementById("focusSessions").textContent = sessions;
        localStorage.setItem("focusSessions", sessions);
      }

      function loadStats() {
        // Load saved stats
        totalStudyTime = parseInt(
          localStorage.getItem("totalStudyTime") || "0",
        );
        const hours = (totalStudyTime / 3600).toFixed(1);
        document.getElementById("studyTime").textContent = hours;

        const completedTasks = localStorage.getItem("tasksCompleted") || "0";
        document.getElementById("tasksCompleted").textContent = completedTasks;

        const focusSessions = localStorage.getItem("focusSessions") || "0";
        document.getElementById("focusSessions").textContent = focusSessions;

        // Calculate streak (simplified - just using local storage)
        const lastStudyDate = localStorage.getItem("lastStudyDate");
        const today = new Date().toDateString();
        let streak = parseInt(localStorage.getItem("studyStreak") || "0");

        if (lastStudyDate !== today) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);

          if (lastStudyDate === yesterday.toDateString()) {
            streak++;
          } else if (lastStudyDate !== today) {
            streak = 1;
          }

          localStorage.setItem("lastStudyDate", today);
          localStorage.setItem("studyStreak", streak);
        }

        document.getElementById("streak").textContent = streak;
      }

      // Notification function
      function notifyUser(message) {
        // In a real Electron app, you could use native notifications
        // For now, we'll use a simple alert
        console.log(message);

        // You could also create a toast notification
        const toast = document.createElement("div");
        toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(102, 126, 234, 0.9);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.animation = "slideOut 0.3s ease";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // Add animations
      const style = document.createElement("style");
      style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(300px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(300px); opacity: 0; }
            }
        `;
      document.head.appendChild(style);

      // Initialize app
      document.addEventListener("DOMContentLoaded", function () {
        updateTimerDisplay();
        loadTodos();
        loadNotes();
        generateCalendar();
        loadStats();
        updateTaskCount();

        // Set up Enter key for todo input
        document
          .getElementById("todoInput")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              addTodo();
            }
          });

        // Animate widgets on load
        const widgets = document.querySelectorAll(".widget");
        widgets.forEach((widget, index) => {
          widget.style.opacity = "0";
          widget.style.transform = "translateY(20px)";

          setTimeout(() => {
            widget.style.transition = "all 0.5s ease";
            widget.style.opacity = "1";
            widget.style.transform = "translateY(0)";
          }, index * 100);
        });
      });

      // Save state periodically
      setInterval(() => {
        if (!isPaused) {
          updateStats();
        }
      }, 60000); // Every minute
    </script>
  </body>
</html>
